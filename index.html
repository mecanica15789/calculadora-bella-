<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: Arial, Helvetica, sans-serif;
    }

    body {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: linear-gradient(135deg, #5865F2, #23272a);
        padding: 20px;
    }

    .container {
        width: 100%;
        max-width: 450px;
        background: rgba(255, 255, 255, 0.10);
        backdrop-filter: blur(15px);
        border: 1px solid rgba(255, 255, 255, 0.15);
        border-radius: 25px;
        padding: 45px 30px;
        text-align: center;
        box-shadow: 0 20px 50px rgba(0, 0, 0, 0.35);
    }

    .discord-icon {
        width: 100px;
        height: 100px;
        margin: 0 auto 25px;
        background: #5865F2;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: 0 10px 30px rgba(88, 101, 242, 0.5);
    }

    .discord-icon span {
        color: white;
        font-size: 48px;
        font-weight: bold;
    }

    h1 {
        color: white;
        font-size: 30px;
        margin-bottom: 12px;
    }

    p {
        color: #e4e4e4;
        font-size: 16px;
        line-height: 1.6;
        margin-bottom: 30px;
    }

    .discord-button {
        display: block;
        width: 100%;
        padding: 16px;
        background: #5865F2;
        color: white;
        text-decoration: none;
        border-radius: 12px;
        font-size: 18px;
        font-weight: bold;
        transition: 0.3s;
        box-shadow: 0 8px 20px rgba(0, 0, 0, 0.25);
    }

    .discord-button:hover {
        background: #4752c4;
        transform: translateY(-3px);
        box-shadow: 0 12px 25px rgba(0, 0, 0, 0.35);
    }

    .footer {
        margin-top: 25px;
        color: rgba(255, 255, 255, 0.65);
        font-size: 13px;
    }
</style>
